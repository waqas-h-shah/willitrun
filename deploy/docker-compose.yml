name: willitrun
services:
  web:
    build: { context: ./src }
    image: willitrun:local
    container_name: willitrun
    restart: unless-stopped
    networks: [web]
    volumes: ["willitrun-data:/data"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    labels: { autoheal: "true" }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy: { resources: { limits: { memory: 512m } } }
volumes:
  willitrun-data:
networks:
  web: { external: true }
